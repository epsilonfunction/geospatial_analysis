[project]
name = "geospatial-analysis"
version = "0.1.0"
description = "Singapore weather forecast analytics, historical replay, and forward evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "branca>=0.8.2",
    "cartopy>=0.25.0",
    "cfgrib>=0.9.15.1",
    "contextily>=1.7.0",
    "dash>=3.3.0",
    "duckdb>=1.3.0",
    "ecmwf-api-client>=1.6.5",
    "ecmwf-opendata>=0.3.26",
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "ipykernel>=7.1.0",
    "ipython>=9.7.0",
    "joblib>=1.4.2",
    "matplotlib>=3.10.7",
    "metview>=1.16.2",
    "numpy>=2.3.5",
    "openmeteo-requests>=1.7.5",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "polars>=1.35.2",
    "pyarrow>=18.0.0",
    "pooch>=1.9.0",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "scipy>=1.16.3",
    "scikit-learn>=1.6.0",
    "streamlit>=1.61.1",
    "xarray>=2026.2.0",
]

[project.scripts]
weather-engine = "weather_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

